name: update-kafei

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kafei
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch latest kafei streams
        run: python3 scripts/gen_kafei.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kafei.m3u kafei.txt kafei.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh kafei playlist"
            git pull --rebase origin main
            git push
          fi
